name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: "@lantern-product"

      # npm Trusted Publishing (OIDC) requires npm CLI >= 11.5.1.
      # Node 20 ships with npm 10, so upgrade before the publish step.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Diagnostic — surfaces auth state and OIDC env presence so failed
      # publishes have clearer evidence than the registry's generic 404.
      # Safe to keep around; nothing here prints secrets.
      - name: Diagnostic — pre-publish state
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC env: ACTIONS_ID_TOKEN_REQUEST_URL is present"
          else
            echo "OIDC env: ACTIONS_ID_TOKEN_REQUEST_URL is MISSING (id-token permission?)"
          fi
          echo "--- ~/.npmrc (auth values redacted) ---"
          if [ -f "$HOME/.npmrc" ]; then
            sed -E 's/(_authToken=).*$/\1[REDACTED]/' "$HOME/.npmrc"
          else
            echo "no ~/.npmrc present"
          fi
          echo "--- ./.npmrc (auth values redacted) ---"
          if [ -f ".npmrc" ]; then
            sed -E 's/(_authToken=).*$/\1[REDACTED]/' .npmrc
          else
            echo "no ./.npmrc present"
          fi

      # No NPM_TOKEN here: npm CLI uses the GitHub OIDC token (id-token: write
      # permission above) to authenticate against npmjs.com via the Trusted
      # Publisher we configured for @lantern-product/ui.
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js for GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        uses: actions/setup-node@v4
        with:
          registry-url: https://npm.pkg.github.com
          scope: "@lantern-product"

      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        run: npm publish --workspace @lantern-product/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
