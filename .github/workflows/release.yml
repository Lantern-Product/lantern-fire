name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: "@lantern-product"

      # npm Trusted Publishing (OIDC) requires npm CLI >= 11.5.1.
      # Node 20 ships with npm 10, so upgrade before the publish step.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # actions/setup-node@v4 with `registry-url` writes a userconfig file
      # at $NPM_CONFIG_USERCONFIG (typically /home/runner/work/_temp/.npmrc)
      # containing:
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      #   always-auth=true
      # With NODE_AUTH_TOKEN unset (the OIDC pattern), ${NODE_AUTH_TOKEN}
      # resolves to an empty string. npm reads the empty _authToken= and
      # sends an empty Bearer header on PUT, which the registry rejects
      # with 404 — and which prevents npm's OIDC fallback from engaging.
      # Strip the placeholder line so npm sees no token and triggers the
      # OIDC exchange via the Trusted Publisher we configured for the package.
      - name: Strip placeholder authToken from $NPM_CONFIG_USERCONFIG for OIDC
        run: |
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken=/d' "$NPM_CONFIG_USERCONFIG"
            echo "Stripped _authToken= from $NPM_CONFIG_USERCONFIG"
          else
            echo "NPM_CONFIG_USERCONFIG not set or file not present — nothing to strip"
          fi

      # Diagnostic — surfaces auth state and OIDC env presence so failed
      # publishes have clearer evidence than the registry's generic 404.
      # Safe to keep around; nothing here prints secrets.
      - name: Diagnostic — pre-publish state
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC env: ACTIONS_ID_TOKEN_REQUEST_URL is present"
          else
            echo "OIDC env: ACTIONS_ID_TOKEN_REQUEST_URL is MISSING (id-token permission?)"
          fi
          echo "--- ~/.npmrc (auth values redacted) ---"
          if [ -f "$HOME/.npmrc" ]; then
            sed -E 's/(_authToken=).*$/\1[REDACTED]/' "$HOME/.npmrc"
          else
            echo "no ~/.npmrc present"
          fi
          echo "--- ./.npmrc (auth values redacted) ---"
          if [ -f ".npmrc" ]; then
            sed -E 's/(_authToken=).*$/\1[REDACTED]/' .npmrc
          else
            echo "no ./.npmrc present"
          fi
          echo "--- \$NPM_CONFIG_USERCONFIG (auth values redacted) ---"
          echo "path: ${NPM_CONFIG_USERCONFIG:-(unset)}"
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -E 's/(_authToken=).*$/\1[REDACTED]/' "$NPM_CONFIG_USERCONFIG"
          else
            echo "NPM_CONFIG_USERCONFIG not set or file not present"
          fi

      # Diagnostic — decode the OIDC token claims GitHub Actions will send
      # to npm. Lets us verify that the Trusted Publisher config on npm
      # exactly matches the claims (repository, workflow_ref, environment).
      # The JWT payload is base64url-encoded JSON — readable without the
      # signing key. We deliberately only print public metadata claims
      # (repository, ref, workflow_ref, environment, sub) and never the
      # token itself or its signature.
      - name: Diagnostic — OIDC token claims (for npm Trusted Publisher matching)
        run: |
          set -e
          AUD="npm:registry.npmjs.org"
          # Request an OIDC token for the npm audience.
          RESPONSE=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD}")
          # The token has 3 dot-separated base64url segments; the middle is the payload.
          JWT=$(echo "$RESPONSE" | node -e "let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).value))")
          PAYLOAD_B64URL=$(echo "$JWT" | cut -d. -f2)
          # base64url -> base64 (+/= padding)
          PAYLOAD_B64=$(echo "$PAYLOAD_B64URL" | tr '_-' '/+')
          # Add padding to multiple of 4
          PADLEN=$(( (4 - ${#PAYLOAD_B64} % 4) % 4 ))
          PAD=$(printf '=%.0s' $(seq 0 $PADLEN))
          PAYLOAD_JSON=$(echo "${PAYLOAD_B64}${PAD}" | base64 -d 2>/dev/null || echo "{}")
          echo "$PAYLOAD_JSON" | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              const c=JSON.parse(d);
              const safe={
                iss:c.iss,
                aud:c.aud,
                repository:c.repository,
                repository_owner:c.repository_owner,
                ref:c.ref,
                ref_type:c.ref_type,
                event_name:c.event_name,
                workflow:c.workflow,
                workflow_ref:c.workflow_ref,
                job_workflow_ref:c.job_workflow_ref,
                environment:c.environment ?? '(none)',
                sub:c.sub,
              };
              console.log('--- OIDC claims (subset; what npm Trusted Publisher matches against) ---');
              console.log(JSON.stringify(safe,null,2));
            });
          "

      # No NPM_TOKEN here: npm CLI uses the GitHub OIDC token (id-token: write
      # permission above) to authenticate against npmjs.com via the Trusted
      # Publisher we configured for @lantern-product/ui.
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js for GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        uses: actions/setup-node@v4
        with:
          registry-url: https://npm.pkg.github.com
          scope: "@lantern-product"

      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        run: npm publish --workspace @lantern-product/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
